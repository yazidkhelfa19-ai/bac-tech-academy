const key="bac_academy_direct";let S=JSON.parse(localStorage.getItem(key)||"null")||{lessons:{},projects:{},certs:{},notes:"",reviews:"",days:{},bacMode:false,bacDate:"2027-06-20"};

function navBuild(){document.getElementById("nav").innerHTML=nav.map(x=>`<button data-nav="${x[0]}" onclick="go('${x[0]}')">${x[1]} &nbsp; ${x[2]}</button>`).join("");document.getElementById("mobile").innerHTML=nav.slice(0,5).map(x=>`<button onclick="go('${x[0]}')">${x[1]}<br>${x[2]}</button>`).join("")}
function doneCount(){return stages.reduce((n,s)=>n+s.lessons.filter((_,i)=>S.lessons[s.title+"_"+i]).length,0)}

function sp(i){let s=stages[i],d=s.lessons.filter((_,j)=>S.lessons[s.title+"_"+j]).length;return Math.round(d/s.lessons.length*100)}
function card(i){let s=stages[i];return `<div class="card stage"><div class="stagehead"><div style="display:flex;gap:11px"><div class="num">${i+1}</div><div><b>${s.ar}</b><div class="muted">${s.title}</div></div></div><span class="tag">${sp(i)}%</span></div><div class="muted" style="margin:13px 0 6px">${s.lessons.length} دروس · مشروع: ${s[3]}</div><div class="progress"><i style="width:${sp(i)}%"></i></div><div class="actions"><button class="btn primary" onclick="stage(${i})">فتح المرحلة</button></div></div>`}

function project(i){S.projects[i]=!S.projects[i];save();stage(i)}

  if (!s) return `<div class="lesson source"><div><b>المصدر غير موجود</b></div></div>`;
  return `<div class="lesson source">
    <div><b>${s[1]}</b><br><span class="muted">${s[2]}</span></div>
    <a class="btn small" href="${s[3]}" target="_blank" rel="noopener noreferrer">فتح المصدر ↗</a>
  </div>`;
}
function closeModal(){document.getElementById("modal").classList.remove("open");render(document.querySelector(".view.active").id)}
function roadmap(){document.getElementById("roadmap").innerHTML=`<div class="hero"><h1>خارطة التعلم</h1><p>الترتيب النهائي: Python → GitHub → Web → APIs → AI. الميزانية 3 ساعات أسبوعياً، والهدف هو القدرة العملية لا جمع الدورات.</p><div class="grid2"><div class="card"><b>سبتمبر</b><p class="muted">Python: Functions, Variables + أول تمارين.</p></div><div class="card"><b>أكتوبر</b><p class="muted">Conditionals, Loops, Exceptions + مشروع BAC Average Calculator.</p></div><div class="card"><b>نوفمبر</b><p class="muted">Libraries, Unit Tests, File I/O + بداية Study Tracker.</p></div><div class="card"><b>ديسمبر</b><p class="muted">Regex, OOP, Et Cetera + إنهاء Study Tracker.</p></div><div class="card"><b>يناير</b><p class="muted">Git + GitHub + Portfolio احترافي.</p></div><div class="card"><b>فبراير</b><p class="muted">HTML/CSS/JS/DOM + BAC Dashboard.</p></div><div class="card"><b>مارس</b><p class="muted">HTTP/JSON/REST/Fetch + API Mini-App.</p></div><div class="card"><b>أبريل</b><p class="muted">AI concepts + GenAI + Mini-App اختياري.</p></div><div class="card"><b>آخر 60 يوماً</b><p class="muted">الباك أولاً. المسار التقني يتوقف أو يصبح 0–1 ساعة فقط حسب مستوى الضغط.</p></div></div></div>${stages.map((_,i)=>card(i)).join("")}` }
function stagesView(){document.getElementById("stages").innerHTML=`<div class="section"><h2>كل المراحل</h2></div><div class="grid">${stages.map((_,i)=>card(i)).join("")}</div>`}
function projects(){document.getElementById("projects").innerHTML=`<div class="hero"><h1>المشاريع</h1><p>المشاريع هي أهم دليل على المهارة.</p></div><div class="grid">${stages.map((s,i)=>`<div class="card"><span class="tag">Stage ${i+1}</span><h3>${s.project}</h3><p class="muted">${s.ar}</p><button class="btn" onclick="stage(${i})">المتطلبات</button> <button class="btn ${S.projects[i]?"good":""}" onclick="project(${i})">${S.projects[i]?"✓ مكتمل":"إنهاء"}</button></div>`).join("")}</div>`}
function sourceView(){document.getElementById("sources").innerHTML=`<div class="hero"><h1>مكتبة المصادر</h1><p>مصدر رئيسي لكل مهارة، مع مراجع عند الحاجة.</p></div>${sources.map(s=>src(s[0])).join("")}`}
function certView(){document.getElementById("certificates").innerHTML=`<div class="hero"><h1>الشهادات</h1><p>الشهادة دليل إضافي وليست الهدف. لا تسمح لها بإزاحة الباك.</p></div><div class="grid2">${certs.map((c,i)=>`<div class="card"><span class="tag">${i?"OPTIONAL":"MAIN"}</span><h3>${c[0]}</h3><p class="muted">${c[1]}</p><a class="btn primary" href="${c[2]}" target="_blank" rel="noopener">فتح المصدر ↗</a> <button class="btn ${S.certs[i]?"good":""}" onclick="cert(${i})">${S.certs[i]?"✓ مكتملة":"تحديد"}</button></div>`).join("")}</div>`}
function cert(i){S.certs[i]=!S.certs[i];save();certView()}
function calendar(){let d=new Date(),y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1).getDay(),num=new Date(y,m+1,0).getDate(),h="";for(let i=0;i<first;i++)h+="<div></div>";for(let n=1;n<=num;n++){let k=y+"-"+m+"-"+n;h+=`<div class="day"><b>${n}</b><br><small><input type="checkbox" ${S.days[k]?"checked":""} onchange="S.days['${k}']=this.checked;save()"> 60 دقيقة</small></div>`}document.getElementById("calendar").innerHTML=`<div class="hero"><h1>تقويم التنفيذ</h1><p>3 جلسات × 60 دقيقة أسبوعياً. أسابيع الاختبارات: خفّض. آخر 60 يوماً: BAC Mode.</p></div><div class="card"><h3>${d.toLocaleString("ar-DZ",{month:"long",year:"numeric"})}</h3><div class="calendar">${h}</div></div>`}
function notes(){document.getElementById("notes").innerHTML=`<div class="hero"><h1>الملاحظات</h1><p>سجل الأخطاء والأسئلة والأفكار.</p></div><textarea class="note" id="nt">${S.notes}</textarea><div class="actions"><button class="btn primary" onclick="S.notes=document.getElementById('nt').value;save()">حفظ</button></div>`}
function review(){document.getElementById("review").innerHTML=`<div class="hero"><h1>المراجعة الأسبوعية</h1><p>هل تعلمت؟ هل بنيت؟ هل راجعت أخطاءك؟ وهل بقي الباك هو الأولوية؟</p></div><textarea class="note" id="rv">${S.reviews}</textarea><div class="actions"><button class="btn primary" onclick="S.reviews=document.getElementById('rv').value;save()">حفظ المراجعة</button></div>`}
function search(){document.getElementById("search").innerHTML=`<div class="hero"><h1>البحث</h1><input class="search" id="q" placeholder="ابحث: Python، API، GitHub..." oninput="doSearch()"></div><div id="res"></div>`}
function doSearch(){let q=(document.getElementById("q").value||"").toLowerCase(),a=[];stages.forEach((s,i)=>{s.lessons.forEach(x=>{if((x+" "+s.title+" "+s.ar).toLowerCase().includes(q))a.push(`<div class="card" style="margin:8px 0"><b>${s[1]} — ${x}</b><br><button class="btn" onclick="stage(${i})">فتح المرحلة</button></div>`)});if((s[3]).toLowerCase().includes(q))a.push(`<div class="card" style="margin:8px 0"><b>مشروع: ${s.project}</b></div>`)});sources.forEach(s=>{if((s.ar+" "+s.lessons).toLowerCase().includes(q))a.push(src(s.title))});document.getElementById("res").innerHTML=q?(a.length?a.join(""):"<div class='card'>لا توجد نتائج.</div>"):""}
function settings(){document.getElementById("settings").innerHTML=`<div class="hero"><h1>الإعدادات</h1><p>تقدمك محفوظ محلياً على هذا الجهاز والمتصفح.</p></div><div class="grid2"><div class="card"><h3>حماية أولوية الباك</h3><label><input type="checkbox" ${S.bacMode?"checked":""} onchange="S.bacMode=this.checked;save();settings()"> تفعيل BAC Mode</label><p class="muted">التاريخ:</p><input class="search" type="date" value="${S.bacDate}" onchange="S.bacDate=this.value;save()"></div><div class="card"><h3>التقدم</h3><button class="btn" onclick="exportData()">تصدير JSON</button> <button class="btn" onclick="importData()">استيراد</button> <button class="btn danger" onclick="resetData()">إعادة ضبط</button></div></div>`}
function exportData(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));a.download="bac-tech-progress.json";a.click()}
function importData(){let i=document.createElement("input");i.type="file";i.accept=".json";i.onchange=()=>{let r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();location.reload()}catch(e){alert("ملف غير صالح")}};r.readAsText(i.files.title)};i.click()}
function resetData(){if(confirm("حذف كل التقدم؟")){localStorage.removeItem(key);location.reload()}}
function render(id){({dashboard,roadmap,stages:stagesView,projects,sources:sourceView,certificates:certView,calendar,notes,review,search,settings}[id]||dashboard)()}
navBuild();save();render("dashboard");
</script></body></html>
